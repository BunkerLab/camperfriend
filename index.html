<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2E5D4B">
<title>Fichador · Camper</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚐</text></svg>">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --coral: #FF5A5F; --coral-osc: #E0484D; --coral-suave: #FFF0F0;
    --tinta: #222222; --gris: #717171; --gris-claro: #EBEBEB;
    --fondo: #F7F7F7; --caja: #FFFFFF;
  }
  body {
    margin: 0; font-family: "Inter", system-ui, -apple-system, sans-serif;
    background: var(--fondo); min-height: 100vh; color: var(--tinta);
    display: flex; align-items: flex-start; justify-content: center; padding: 16px;
    -webkit-font-smoothing: antialiased;
  }
  .phone {
    width: 100%; max-width: 400px; background: var(--caja); border-radius: 20px;
    padding: 24px; box-shadow: 0 6px 20px rgba(0,0,0,.05), 0 1px 3px rgba(0,0,0,.04);
  }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .logo { font-size: 24px; background: var(--coral-suave); width: 44px; height: 44px;
          border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  .title { font-weight: 600; font-size: 16px; color: var(--tinta); letter-spacing: -.2px; }
  .sub { font-size: 13px; color: var(--gris); margin-top: 1px; }
  .clock { background: var(--fondo); border-radius: 16px; padding: 26px 16px;
           text-align: center; margin-bottom: 16px; border: 1px solid transparent; transition: .25s; }
  .clock.on { background: var(--coral-suave); border-color: rgba(255,90,95,.25); }
  .clock-lbl { font-size: 13px; color: var(--gris); margin-bottom: 8px; }
  .clock-big { font-size: 46px; font-weight: 700; color: var(--tinta);
               letter-spacing: -1.5px; font-variant-numeric: tabular-nums; }
  .clock.on .clock-big { color: var(--coral-osc); }
  .clock-big.off { color: var(--gris-claro); }
  .clock-note { font-size: 13px; color: var(--coral-osc); margin-top: 8px; }
  .live { display: inline-flex; align-items: center; gap: 7px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--coral);
              animation: pulse 1s steps(1,end) infinite; }
  @keyframes pulse { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
  input.nota, input.edit-field {
    width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--gris-claro);
    font-size: 15px; margin-bottom: 12px; outline: none; font-family: inherit; color: var(--tinta);
    transition: border-color .15s;
  }
  input.edit-field[type="datetime-local"] {
    -webkit-appearance: none; appearance: none; background: var(--caja);
    min-height: 50px; display: block;
  }
  input.edit-field[type="datetime-local"]::-webkit-date-and-time-value {
    text-align: left; margin: 0;
  }
  input.nota::placeholder { color: #B0B0B0; }
  input.nota:focus, input.edit-field:focus { border-color: var(--tinta); }
  .btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-size: 16px;
         font-weight: 600; color: #fff; cursor: pointer; margin-bottom: 18px; letter-spacing: -.2px;
         transition: transform .08s, background .15s; }
  .btn:active { transform: scale(.985); }
  .btn.start { background: var(--coral); }
  .btn.start:active { background: var(--coral-osc); }
  .btn.stop { background: var(--tinta); }
  .btn:disabled { opacity: .4; }
  .totals { display: flex; gap: 12px; margin-bottom: 24px; }
  .tbox { flex: 1; background: var(--fondo); border-radius: 14px; padding: 16px 12px; text-align: center; }
  .tnum { font-size: 24px; font-weight: 700; color: var(--tinta); letter-spacing: -.5px; }
  .tlbl { font-size: 12px; color: var(--gris); margin-top: 3px; }
  .hist-head { display: flex; justify-content: space-between; align-items: center;
               margin-bottom: 12px; font-size: 15px; font-weight: 600; color: var(--tinta); }
  .refresh { background: none; border: 1px solid var(--gris-claro); border-radius: 20px;
             padding: 7px 14px; font-size: 13px; color: var(--tinta); cursor: pointer; font-weight: 500;
             transition: border-color .15s; }
  .refresh:active { border-color: var(--tinta); }
  .list { display: flex; flex-direction: column; gap: 0; }
  .empty { color: var(--gris); font-size: 14px; text-align: center; padding: 28px 10px; }
  .item { background: var(--caja); padding: 16px 2px; border-bottom: 1px solid var(--gris-claro); }
  .item:last-child { border-bottom: none; }
  .item-top { display: flex; justify-content: space-between; align-items: center; }
  .item-dur { font-weight: 600; color: var(--tinta); font-size: 16px; letter-spacing: -.2px; }
  .item-meta { font-size: 13px; color: var(--gris); margin-top: 3px; }
  .item-nota { font-size: 14px; color: var(--tinta); margin-top: 4px; }
  .item-right { display: flex; align-items: center; gap: 12px; }
  .item-euro { font-weight: 600; color: var(--tinta); font-size: 15px; }
  .edit-btn { background: none; border: none; color: var(--gris); font-size: 13px;
              cursor: pointer; text-decoration: underline; padding: 2px 4px; font-weight: 500; }
  .edit-box { margin-top: 14px; padding-top: 4px; }
  .edit-box label { font-size: 12px; color: var(--gris); display: block; margin-bottom: 4px; font-weight: 500; }
  .edit-row { display: flex; flex-direction: column; gap: 10px; }
  .edit-row > div { flex: 1; }
  .edit-actions { display: flex; gap: 8px; margin-top: 6px; }
  .mini { padding: 11px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; flex: 1; }
  .mini.save { background: var(--coral); color: #fff; }
  .mini.cancel { background: var(--fondo); color: var(--tinta); border: 1px solid var(--gris-claro); }
  .mini.del { background: none; color: var(--coral-osc); border: 1px solid var(--gris-claro); }
  .cfg { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--gris-claro);
         font-size: 13px; color: var(--gris); text-align: center; line-height: 1.9; }
  .cfg a { color: var(--tinta); cursor: pointer; text-decoration: underline; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 20px;
           background: var(--coral-suave); color: var(--coral-osc); font-weight: 600; margin-left: 4px; }
  /* Pantalla de acceso */
  .gate { text-align: center; padding: 16px 6px; }
  .gate h2 { color: var(--tinta); margin: 12px 0 4px; font-weight: 600; letter-spacing: -.3px; }
  .gate p { color: var(--gris); font-size: 14px; margin: 0 0 20px; }
  .status { font-size: 13px; color: var(--gris); text-align: center; margin-top: 10px; min-height: 16px; }
  .err { color: var(--coral-osc); }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="phone" id="app"></div>

<script>
// ═══════════════════════════════════════════════════════════════
//  CONFIGURACIÓN — rellena estas dos líneas con tus claves de Supabase
//  (las encuentras en Supabase → Project Settings → API)
// ═══════════════════════════════════════════════════════════════
const SUPABASE_URL = "https://sirhampdbynywexmzeum.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpcmhhbXBkYnlueXdleG16ZXVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2ODY0NDIsImV4cCI6MjEwMzI2MjQ0Mn0.SGZAaoI7AOChS8X19ucN9n7XY4Pev1b1xG9VchkXP0s";
const TARIFA_DEFECTO = 10; // €/hora
const VENTANA_EDICION_MIN = 60; // minutos que puede editar Hugo tras terminar
const PASS_ADMIN = "camper-edgar"; // contraseña de Edgar (admin) — cámbiala por la que quieras
// ═══════════════════════════════════════════════════════════════

const LKEY = "fichador_camper_cloud";
let sb = null, activa = null, historial = [], tarifa = TARIFA_DEFECTO;
let codigo = localStorage.getItem(LKEY + "_codigo") || null;
let persona = localStorage.getItem(LKEY + "_persona") || null; // "Hugo" | "Edgar"
let editando = null; // id del fichaje en edición
let timer = null;
const esAdmin = () => persona === "Edgar";

const cfgOk = SUPABASE_URL !== "PON_AQUI_TU_URL" && SUPABASE_KEY !== "PON_AQUI_TU_ANON_KEY";
if (cfgOk) sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
const fmtDur = (ms) => { const m = Math.floor(ms/60000); return `${Math.floor(m/60)}h ${String(m%60).padStart(2,"0")}m`; };
const fmtHora = (ts) => new Date(ts).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
const fmtFecha = (ts) => new Date(ts).toLocaleDateString("es-ES",{weekday:"short",day:"2-digit",month:"short"});
const escapeHtml = (s="") => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// para inputs datetime-local (hora local sin zona)
const toLocalInput = (ts) => { const d=new Date(ts); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); };
const fromLocalInput = (v) => new Date(v).getTime();

// ── Pantalla de acceso ─────────────────────────────────────────
function renderGate(msg) {
  $("app").innerHTML = `
    <div class="gate">
      <div class="logo" style="margin:0 auto">🚐</div>
      <h2>Fichador · Camper</h2>
      <p>Introduce el código para acceder</p>
      <input class="nota" id="codeInput" placeholder="Código secreto" style="text-align:center">
      <button class="btn start" id="enterBtn">Entrar</button>
      <div class="status ${msg?'err':''}" id="gateStatus">${msg||""}</div>
    </div>`;
  $("enterBtn").onclick = () => {
    const c = $("codeInput").value.trim();
    if (!c) { $("gateStatus").textContent = "Escribe el código."; return; }
    codigo = c; localStorage.setItem(LKEY + "_codigo", c);
    cargar();
  };
  $("codeInput").addEventListener("keydown", e => { if (e.key==="Enter") $("enterBtn").click(); });
}

// ── Pantalla: ¿Quién eres? ─────────────────────────────────────
function renderPersona(msg) {
  $("app").innerHTML = `
    <div class="gate">
      <div class="logo" style="margin:0 auto">🚐</div>
      <h2>¿Quién eres?</h2>
      <p>Elige tu nombre para entrar</p>
      <button class="btn start" id="soyHugo" style="margin-bottom:12px">Hugo</button>
      <button class="btn" id="soyEdgar" style="background:var(--tinta)">Edgar (admin)</button>
      <div id="adminPass" style="display:none;margin-top:16px">
        <input class="nota" id="passInput" type="password" placeholder="Contraseña de admin" style="text-align:center">
        <button class="btn start" id="passBtn">Entrar como Edgar</button>
      </div>
      <div class="status ${msg?'err':''}" id="pStatus">${msg||""}</div>
      <div style="margin-top:14px"><a class="cfg-link" id="cambiarCodigo" style="color:var(--gris);font-size:12px;text-decoration:underline;cursor:pointer">cambiar código</a></div>
    </div>`;
  $("soyHugo").onclick = () => { persona = "Hugo"; localStorage.setItem(LKEY+"_persona","Hugo"); cargar(); };
  $("soyEdgar").onclick = () => { $("adminPass").style.display = "block"; $("passInput").focus(); };
  const entrarEdgar = () => {
    if ($("passInput").value === PASS_ADMIN) {
      persona = "Edgar"; localStorage.setItem(LKEY+"_persona","Edgar"); cargar();
    } else { renderPersona("Contraseña incorrecta."); $("adminPass").style.display="block"; }
  };
  $("passBtn").onclick = entrarEdgar;
  $("passInput").addEventListener("keydown", e => { if (e.key==="Enter") entrarEdgar(); });
  $("cambiarCodigo").onclick = () => {
    localStorage.removeItem(LKEY+"_codigo"); localStorage.removeItem(LKEY+"_persona");
    codigo = null; persona = null; renderGate();
  };
}

// ── App principal ──────────────────────────────────────────────
function renderApp() {
  const totMs = historial.reduce((a,s)=>a+(s.fin-s.inicio),0);
  const totH = totMs/3600000;
  $("app").innerHTML = `
    <header>
      <div class="logo">🚐</div>
      <div>
        <div class="title">Fichador · Camper</div>
        <div class="sub">Ficha tus horas de trabajo</div>
      </div>
    </header>
    <div class="clock ${activa?'on':''}">
      <div class="clock-lbl">${activa?`<span class="live"><span class="live-dot"></span>Trabajando desde las ${fmtHora(activa.inicio)}</span>`:"Sin fichaje activo"}</div>
      <div class="clock-big ${activa?'':'off'}" id="clockBig">${activa?fmtDur(Date.now()-activa.inicio):"0h 00m"}</div>
      ${activa&&activa.nota?`<div class="clock-note">“${escapeHtml(activa.nota)}”</div>`:""}
    </div>
    ${!activa?`<input class="nota" id="notaInput" placeholder="¿En qué vas a trabajar? (opcional)">`:""}
    <button class="btn ${activa?'stop':'start'}" id="mainBtn">${activa?"■ Terminar":"▶ Empezar"}</button>
    <div class="totals">
      <div class="tbox"><div class="tnum">${totH.toFixed(1)}h</div><div class="tlbl">acumuladas</div></div>
      <div class="tbox"><div class="tnum">${Math.round(totH*tarifa)}€</div><div class="tlbl">a ${tarifa}€/h</div></div>
    </div>
    <div class="hist-head">
      <span>Historial</span>
      <button class="refresh" id="refreshBtn">↻ Actualizar</button>
    </div>
    <div class="list" id="list"></div>
    <div class="cfg">
      ${escapeHtml(persona||"")}${esAdmin()?' <span class="badge">admin</span>':''} · <a id="salir">salir</a><br>
      Tarifa ${tarifa}€/h${esAdmin()?' · <a id="cfgTarifa">cambiar</a>':''}
    </div>`;

  $("mainBtn").onclick = onMain;
  $("refreshBtn").onclick = cargar;
  $("salir").onclick = () => {
    localStorage.removeItem(LKEY+"_codigo"); localStorage.removeItem(LKEY+"_persona");
    codigo=null; persona=null; renderGate();
  };
  if ($("cfgTarifa")) $("cfgTarifa").onclick = onTarifa;
  renderList();
  if (activa && !timer) timer = setInterval(()=>{ if(activa) $("clockBig").textContent=fmtDur(Date.now()-activa.inicio); }, 1000);
  if (!activa && timer) { clearInterval(timer); timer=null; }
}

function renderList() {
  const list = $("list");
  if (!list) return;
  if (historial.length === 0) { list.innerHTML = '<div class="empty">Aún no hay fichajes. Dale a Empezar.</div>'; return; }
  const ahora = Date.now();
  list.innerHTML = historial.map(s => {
    const editable = esAdmin() || (ahora - s.fin) < VENTANA_EDICION_MIN*60000;
    const euro = Math.round((s.fin-s.inicio)/3600000*tarifa);
    if (editando != null && String(editando) === String(s.id)) {
      return `<div class="item">
        <div class="edit-box" style="border:none;padding-top:0">
          <label>Nota</label>
          <input class="edit-field" id="ed-nota-${s.id}" value="${escapeHtml(s.nota||"")}">
          <div class="edit-row">
            <div><label>Empezó</label><input class="edit-field" type="datetime-local" id="ed-ini-${s.id}" value="${toLocalInput(s.inicio)}"></div>
            <div><label>Terminó</label><input class="edit-field" type="datetime-local" id="ed-fin-${s.id}" value="${toLocalInput(s.fin)}"></div>
          </div>
          <div class="edit-actions">
            <button class="mini save" data-save="${s.id}">Guardar</button>
            <button class="mini cancel" data-cancel="1">Cancelar</button>
            <button class="mini del" data-del="${s.id}">Borrar</button>
          </div>
        </div></div>`;
    }
    return `<div class="item">
      <div class="item-top">
        <div>
          <div class="item-dur">${fmtDur(s.fin-s.inicio)}</div>
          <div class="item-meta">${fmtFecha(s.inicio)} · ${fmtHora(s.inicio)}–${fmtHora(s.fin)}</div>
          ${s.nota?`<div class="item-nota">${escapeHtml(s.nota)}</div>`:""}
        </div>
        <div class="item-right">
          <span class="item-euro">${euro}€</span>
          ${editable?`<button class="edit-btn" data-edit="${s.id}">editar</button>`:""}
        </div>
      </div>
    </div>`;
  }).join("");
  list.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ editando=b.dataset.edit; renderList(); });
  list.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>{ editando=null; renderList(); });
  list.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>guardarEdit(b.dataset.save));
  list.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>borrar(b.dataset.del));
}

// ── Acciones ───────────────────────────────────────────────────
async function onMain() {
  if (activa) {
    const fin = Date.now();
    const reg = { ...activa, fin };
    activa = null;
    await sbInsert(reg);
  } else {
    const nota = ($("notaInput")?.value || "").trim();
    activa = { inicio: Date.now(), nota };
    localStorage.setItem(LKEY+"_activa", JSON.stringify(activa));
    renderApp();
    return;
  }
  localStorage.removeItem(LKEY+"_activa");
  await cargar();
}

async function guardarEdit(id) {
  const nota = $(`ed-nota-${id}`).value.trim();
  const inicio = fromLocalInput($(`ed-ini-${id}`).value);
  const fin = fromLocalInput($(`ed-fin-${id}`).value);
  if (!(fin > inicio)) { alert("La hora de fin debe ser posterior al inicio."); return; }
  await sbUpdate(id, { nota, inicio, fin });
  editando = null;
  await cargar();
}

async function borrar(id) {
  if (!confirm("¿Borrar este fichaje?")) return;
  await sbDelete(id);
  editando = null;
  await cargar();
}

async function onTarifa() {
  if (!esAdmin()) return;
  const v = prompt("Precio por hora (€):", tarifa);
  if (v!==null && !isNaN(parseFloat(v))) {
    tarifa = parseFloat(v);
    localStorage.setItem(LKEY+"_tarifa", tarifa);
    await guardarTarifa(tarifa); // compartir con el otro dispositivo
    renderApp();
  }
}

// ── Supabase ───────────────────────────────────────────────────
async function sbInsert(reg) {
  const { error } = await sb.from("fichajes").insert({
    codigo, inicio: new Date(reg.inicio).toISOString(), fin: new Date(reg.fin).toISOString(), nota: reg.nota||""
  });
  if (error) alert("Error al guardar: " + error.message);
}
async function sbUpdate(id, d) {
  const { error } = await sb.from("fichajes").update({
    nota: d.nota, inicio: new Date(d.inicio).toISOString(), fin: new Date(d.fin).toISOString()
  }).eq("id", id).eq("codigo", codigo);
  if (error) alert("Error al editar: " + error.message);
}
async function sbDelete(id) {
  const { error } = await sb.from("fichajes").delete().eq("id", id).eq("codigo", codigo);
  if (error) alert("Error al borrar: " + error.message);
}

async function guardarTarifa(t) {
  const { error } = await sb.from("ajustes").upsert({ codigo, tarifa: t }, { onConflict: "codigo" });
  if (error) console.warn("No se pudo guardar la tarifa compartida:", error.message);
}
async function leerTarifa() {
  const { data, error } = await sb.from("ajustes").select("tarifa").eq("codigo", codigo).maybeSingle();
  if (!error && data && data.tarifa != null) return parseFloat(data.tarifa);
  return null;
}

async function cargar() {
  if (!cfgOk) { renderApp(); return; }
  if (!codigo) { renderGate(); return; }
  if (!persona) { renderPersona(); return; }
  // recuperar fichaje activo local
  try { const a = localStorage.getItem(LKEY+"_activa"); activa = a?JSON.parse(a):null; } catch(e){ activa=null; }
  tarifa = parseFloat(localStorage.getItem(LKEY+"_tarifa")) || TARIFA_DEFECTO;
  // tarifa compartida (la fija Edgar, la ve Hugo)
  try { const tc = await leerTarifa(); if (tc != null) { tarifa = tc; localStorage.setItem(LKEY+"_tarifa", tc); } } catch(e){}

  const { data, error } = await sb.from("fichajes").select("*").eq("codigo", codigo).order("inicio",{ascending:false});
  if (error) {
    if (error.message && /invalid|jwt|key/i.test(error.message)) { renderGate("No se pudo conectar. Revisa las claves."); }
    else { renderGate("Código no válido o sin datos: " + error.message); }
    return;
  }
  historial = (data||[]).map(r => ({ id: r.id, inicio: new Date(r.inicio).getTime(), fin: new Date(r.fin).getTime(), nota: r.nota }));
  renderApp();
}

// ── Arranque ───────────────────────────────────────────────────
if (!cfgOk) {
  $("app").innerHTML = `<div class="gate"><div class="logo" style="margin:0 auto">🚐</div>
    <h2>Falta configurar</h2>
    <p>Abre el archivo y rellena <b>SUPABASE_URL</b> y <b>SUPABASE_KEY</b> con tus claves (mira la guía).</p></div>`;
} else if (!codigo) {
  renderGate();
} else if (!persona) {
  renderPersona();
} else {
  cargar();
}
</script>
</body>
</html>
