  /* Entrada suave de los bloques al renderizar una pantalla */
  #app > * { animation: fadeUp .18s ease-out both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #app > *, .graph-anim { animation: none !important; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button, input, textarea, select { font-family: 'NType', system-ui, sans-serif; }
  :root {
    --rojo: #D71921;
    /* alias para no romper referencias previas */
    --coral: #D71921; --coral-osc: #D71921; --coral-suave: rgba(215,25,33,.14);
  }
  /* Tema oscuro (por defecto) */
  html[data-theme="dark"] {
    --tinta: #FFFFFF; --gris: #8A8A8A; --gris-claro: #2A2A2A;
    --fondo: #0A0A0A; --caja: #151515; --linea: #262626;
  }
  /* Tema claro */
  html[data-theme="light"] {
    --tinta: #111111; --gris: #8A8A8A; --gris-claro: #E4E4E4;
    --fondo: #F2F2F2; --caja: #FFFFFF; --linea: #E4E4E4;
  }
  body {
    margin: 0; font-family: "NType", system-ui, -apple-system, sans-serif;
    background: var(--fondo); min-height: 100vh; color: var(--tinta);
    display: flex; align-items: flex-start; justify-content: center;
    -webkit-font-smoothing: antialiased; transition: background .2s, color .2s;
  }
  .phone {
    width: 100%; max-width: 400px; background: var(--fondo);
    padding: 20px 18px calc(24px + env(safe-area-inset-bottom));
  }
  @media (min-width: 700px) {
    body { padding: 24px; }
    .phone {
      border-radius: 24px; padding: 24px; margin-top: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,.15);
    }
  }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .head-txt { flex: 1; min-width: 0; }
  .icon-btn { background: var(--caja); border: none; border-radius: 12px; cursor: pointer;
              width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
              color: var(--gris); flex-shrink: 0; transition: background .15s, color .15s; }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn:active { background: var(--gris-claro); color: var(--tinta); }
  .logo { font-family: 'Ndot'; font-size: 26px; background: var(--caja); width: 44px; height: 44px;
          border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--tinta); }
  .title { font-weight: 700; font-size: 15px; color: var(--tinta); letter-spacing: .5px; text-transform: uppercase; }
  .sub { font-size: 11px; color: var(--gris); margin-top: 1px; text-transform: uppercase; letter-spacing: 2px; }
  /* Barra timer NOS: reloj en Ndot + botón circular */
  .bar { display: flex; align-items: center; gap: 16px; background: var(--caja);

// Gráfico dot-matrix: cada valor -> una barra de puntos (3 subcolumnas), altura = valor/max
// Dos modos:
//  · patrones (semana): array por día de filas [b0..b3]; cada fila = 1 hora del reloj
//    con actividad, cada punto = 1 cuarto. Apiladas de abajo arriba.
//  · valores (mes): nº por grupo, barra de altura proporcional. 1 punto de ancho.
function dotGraph(valores, max, filas, patrones){
  const step = 7, r = 2.5;
  if (patrones) {
    const grupos = patrones.length;      // 7 días
    const subcols = 4;
    const cellCols = subcols + 2;        // margen entre columnas-día
    const cols = grupos * cellCols;
    const W = cols*step, H = filas*step;
    let svg = `<svg width="100%" height="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">`;
    for(let g=0; g<grupos; g++){
      const base = g*cellCols + Math.floor((cellCols - subcols)/2);
      const dia = patrones[g]; // filas de abajo(0) a arriba
      for(let f=0; f<filas; f++){
        const fila = dia[f]; // puede no existir
        for(let sc=0; sc<subcols; sc++){
          const on = !!(fila && fila[sc]);
          const cx = (base+sc)*step + step/2, cy = H-(f*step+step/2);
          svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="currentColor" opacity="${on?1:0.14}"/>`;
        }
      }
    }
    return svg+'</svg>';
  }
  // modo mes (barras proporcionales, 1 punto de ancho)
  const grupos = valores.length;
  const subcols = 1;
  const cellCols = subcols + 1;
  const cols = grupos * cellCols;
  const W = cols*step, H = filas*step;
  let svg = `<svg width="100%" height="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">`;
  for(let g=0; g<grupos; g++){
    const base = g*cellCols + Math.floor((cellCols - subcols)/2);
    const enc = Math.max(0, Math.round((Math.min(valores[g],max)/max)*filas));
    for(let sc=0; sc<subcols; sc++){
      for(let f=0; f<filas; f++){
        const on = f<enc;
        const cx = (base+sc)*step + step/2, cy = H-(f*step+step/2);
        svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="currentColor" opacity="${on?1:0.14}"/>`;
      }
    }
  }
  return svg+'</svg>';
}

function resumenPeriodo() {
  const ahora = new Date();
  const d = new Date(ahora); const dow = (d.getDay()+6)%7;
  d.setHours(0,0,0,0); d.setDate(d.getDate()-dow);
  const iniSemana = d.getTime();
  const iniMes = new Date(ahora.getFullYear(), ahora.getMonth(), 1).getTime();
  let hSem=0, hMes=0;
  historial.forEach(s=>{
    const dur=(s.fin-s.inicio)/3600000;
    if (s.inicio>=iniSemana) hSem+=dur;
    if (s.inicio>=iniMes) hMes+=dur;
  });
  return { hSem, hMes };
}

// Para cada día (0..ndias-1 desde 'ini'), calcula qué cuartos de reloj se trabajan.
// Devuelve, por día, una lista de filas (máx 12); cada fila es [b0,b1,b2,b3] de cuartos
// encendidos de una hora del reloj con actividad. Solo se incluyen horas con algún cuarto,
// apiladas sin huecos y ordenadas de la más temprana (abajo) a la más tardía (arriba).
function cuartosPorDia(ini, ndias) {
  // relojes[día] = Array(24) de Array(4) booleanos
  const relojes = Array.from({length:ndias}, ()=> Array.from({length:24},()=>[false,false,false,false]));
  historial.forEach(s=>{
    let t = s.inicio;
    const fin = s.fin;
    // avanzar en pasos, marcando cada cuarto de 15 min que toca el intervalo [inicio,fin)
    while (t < fin) {
      const dt = new Date(t);
      const off = Math.floor((new Date(dt).setHours(0,0,0,0) - ini) / 86400000);
      if (off>=0 && off<ndias) {
        const h = dt.getHours();
        const q = Math.floor(dt.getMinutes()/15);
        relojes[off][h][q] = true;
      }
      // saltar al siguiente borde de cuarto
      const siguiente = new Date(t);
      siguiente.setMinutes(Math.floor(dt.getMinutes()/15)*15 + 15, 0, 0);
      t = siguiente.getTime();
    }
  });
  // comprimir: por día, quedarse con las horas que tienen algún cuarto, apiladas sin huecos
  return relojes.map(horas=>{
    const filas = [];
    for (let h=0; h<24; h++){
      if (horas[h].some(Boolean)) filas.push(horas[h].slice());
      if (filas.length>=12) break;
    }
    return filas; // filas[0] = hora más temprana = fila de abajo
  });
}

// Datos del gráfico según rango. Semana: 7 días (L-D), máx 12h.
// Mes: 4-5 semanas del mes actual, máx = mayor semana (mín 12).
function datosGrafico() {
  const ahora = new Date();
  if (graphRango === "semana") {
    const d = new Date(ahora); const dow=(d.getDay()+6)%7;
    d.setHours(0,0,0,0); d.setDate(d.getDate()-dow);
    const ini = d.getTime();
    // patrones[día] = matriz de hasta 12 filas × 4 cuartos (bool). Cada fila = una hora
    // del reloj con actividad, apiladas sin huecos y de abajo (más temprana) arriba.
    const patrones = cuartosPorDia(ini, 7);
    return { patrones, max: 12, filas: 12, labels: ["L","M","X","J","V","S","D"], porCuartos: true };
  } else {
    // Últimos 30 días, cada día una barra. Máx 12h.
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const dias = 30;
    const ini = hoy.getTime() - (dias-1)*86400000;
    const vals = new Array(dias).fill(0);
    historial.forEach(s=>{
      const off = Math.floor((s.inicio-ini)/86400000);
      if (off>=0 && off<dias) vals[off]+=(s.fin-s.inicio)/3600000;
    });
    // etiquetas: solo primer día, mitad y hoy para no saturar
    const fechaCorta = (ts)=> new Date(ts).toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit"});
    const labels = ["-30d","-15d","Hoy"];
    return { vals, max: 12, labels, sparse: true };
  }
}

// Timer estilo reloj: <1h -> M:SS, >=1h -> H:MM
function fmtClock(ms){
  const t=Math.floor(ms/1000);
  const h=Math.floor(t/3600), m=Math.floor((t%3600)/60), s=t%60;
  if (h>0) return h+":"+String(m).padStart(2,"0");
  return m+":"+String(s).padStart(2,"0");
}

// Intensidad efectiva de una línea: la directa, o P/V si solo hay potencia
function intensidadLinea(l) {
  if (l.intensidad!=null && !isNaN(l.intensidad)) return l.intensidad;
  if (l.potencia!=null && !isNaN(l.potencia) && tCalc.V) return l.potencia/tCalc.V;
  return null;
}
// Sección que se usa para una línea: la manual si la hay; si no, la recomendada
// (mayor de caída de tensión y ampacidad), usando la caída máx de la calculadora.
// Devuelve {mm, awg, auto} o null si faltan datos.
function seccionEfectiva(l) {
  if (l.seccion!=null && !isNaN(l.seccion) && l.seccion>0) {
    const cab = TABLA_CABLES.find(c=>c.mm>=l.seccion);
    return { mm: l.seccion, awg: cab?cab.awg:null, auto:false };
  }
  const I = intensidadLinea(l);
  const y = tCalc.mat==="Alumini" ? 35 : 56;
  if (I==null || !l.longitud || !tCalc.e || !tCalc.V) return null;
  const sMin = (2*l.longitud*I)/(y*tCalc.e*tCalc.V);   // por caída
  const porCaida = TABLA_CABLES.find(c=>c.mm>=sMin);
  const porAmp   = TABLA_CABLES.find(c=>c.a>=I);
  if (!porCaida || !porAmp) return null;               // fuera de tabla
  const el = porCaida.mm >= porAmp.mm ? porCaida : porAmp;
  return { mm: el.mm, awg: el.awg, auto:true };
}
// Caída de tensión de una línea: {pct, volt} según e% = (2·L·I)/(S·y·V)
function caidaLinea(l) {
  const I = intensidadLinea(l);
  const y = tCalc.mat==="Alumini" ? 35 : 56;
  const sec = seccionEfectiva(l);
  if (I==null || !sec || !l.longitud || !tCalc.V) return { pct:null, volt:null };
  const pct = (2*l.longitud*I)/(sec.mm*y*tCalc.V);
  return { pct, volt: pct*tCalc.V };
}
// Sección recomendada por la calculadora: S = (2·L·I)/(y·e%·V)
function seccionCalc() {
  const y = tCalc.mat==="Alumini" ? 35 : 56;
  if (!tCalc.L || !tCalc.I || !tCalc.e || !tCalc.V) return null;
  return (2*tCalc.L*tCalc.I)/(y*tCalc.e*tCalc.V);
}

// Tabla estándar de cables (12V DC, cobre, agrupado/en vaina, conservador).
// mm², AWG equivalente, amperios máximos.
const TABLA_CABLES = [
  {mm:0.5, awg:20, a:7},  {mm:0.75,awg:18, a:10}, {mm:1.0, awg:17, a:13},
  {mm:1.5, awg:15, a:16}, {mm:2.5, awg:13, a:25}, {mm:4,  awg:11, a:32},
  {mm:6,   awg:9,  a:40}, {mm:10,  awg:7,  a:60}, {mm:16, awg:5,  a:80},
  {mm:25,  awg:3,  a:110},{mm:35,  awg:2,  a:140},
];
// Recomienda el cable: el más fino que cumpla A LA VEZ caída de tensión y ampacidad.
function recomendarCable() {
  const sMin = seccionCalc();              // mm² mínimos por caída de tensión
  const I = tCalc.I;                        // amperios de la línea
  if (sMin==null || !I) return null;
  const porCaida = TABLA_CABLES.find(c=>c.mm>=sMin);
  const porAmp   = TABLA_CABLES.find(c=>c.a>=I);
  if (!porCaida || !porAmp) return { sMin, sobrepasa:true }; // fuera de tabla
  // el que mande es el de mayor sección
  const elegido = porCaida.mm >= porAmp.mm ? porCaida : porAmp;
  const manda = porCaida.mm > porAmp.mm ? "caida" : (porAmp.mm > porCaida.mm ? "amp" : "ambos");
  return { sMin, elegido, manda, porCaida, porAmp };
}

function bindTensEdit() {
  if (tensEdit==null) return;
  const cerrar = ()=>{ tensEdit=null; renderApp(); };
  if ($("tedCancel")) $("tedCancel").onclick = cerrar;
  if ($("tedBackdrop")) $("tedBackdrop").onclick = (e)=>{ if(e.target===$("tedBackdrop")) cerrar(); };
  if ($("tedSave")) $("tedSave").onclick = async ()=>{
    const num = v => { const n=parseFloat(v); return isNaN(n)?null:n; };
    const l = {
      nombre: $("ted-nom").value.trim(),
      ref: $("ted-ref").value.trim(),
      longitud: num($("ted-lon").value),
      potencia: num($("ted-pot").value),
      intensidad: num($("ted-int").value),
      seccion: num($("ted-sec").value),
    };
    if (!l.nombre) { alert("Ponle un nombre a la línea."); return; }
    if (tensEdit==="nueva") { l.orden = lineas.length; await lineaInsert(l); }
    else await lineaUpdate(tensEdit, l);
    tensEdit=null;
    await cargarLineas();
  };
  if ($("tedDel")) $("tedDel").onclick = ()=>{
    const id = tensEdit;
    confirmar({ titulo:"¿Borrar esta línea?", texto:"No se puede deshacer.", okLabel:"Borrar", onOk: async ()=>{ await lineaDelete(id); tensEdit=null; await cargarLineas(); } });
  };
}

  if ($("selCancel")) $("selCancel").onclick = ()=>{ modoSel=false; diasSel.clear(); renderApp(); };
  if ($("opcionesBtn")) $("opcionesBtn").onclick = ()=>{ modalOpen=true; renderApp(); };
  $$("[data-filtro]").forEach(b=>b.onclick=()=>{ filtro=b.dataset.filtro; modalOpen=false; renderApp(); });
  // acciones dentro del modal de opciones
  if ($("modalPagos")) $("modalPagos").onclick = ()=>{ modalOpen=false; modoSel=true; diasSel.clear(); renderApp(); };
  if ($("modalAdd")) $("modalAdd").onclick = ()=>{ modalOpen=false; renderApp(); setTimeout(abrirManual,0); };
  if ($("modalClose")) $("modalClose").onclick = ()=>{ modalOpen=false; renderApp(); };
  if ($("modalBackdrop")) $("modalBackdrop").onclick = (e)=>{ if(e.target===$("modalBackdrop")){ modalOpen=false; renderApp(); } };
  if ($("confirmCancel")) $("confirmCancel").onclick = cerrarConfirm;
  if ($("confirmBackdrop")) $("confirmBackdrop").onclick = (e)=>{ if(e.target===$("confirmBackdrop")) cerrarConfirm(); };
  if ($("confirmOk")) $("confirmOk").onclick = ()=>{ const fn = confirmState&&confirmState.onOk; confirmState=null; if(fn) fn(); };
  $$("[data-rango]").forEach(b=>b.onclick=()=>{
    if (b.dataset.rango === graphRango) return;
    const dir = b.dataset.rango === "mes" ? 1 : -1; // mes entra desde la derecha, semana desde la izquierda
    graphRango = b.dataset.rango;
    actualizarGrafico(dir);
  });
  if ($("cats")) $$("[data-cat]").forEach(b=>b.onclick=()=>{
    catSel = (catSel===b.dataset.cat ? "" : b.dataset.cat);
    $$("#cats [data-cat]").forEach(x=>x.classList.toggle("sel", x.dataset.cat===catSel));
    validarInicio();
  });
  if ($("cerrarReal")) $("cerrarReal").onclick = onMain;
  if ($("descartar")) $("descartar").onclick = ()=>{ activa=null; localStorage.removeItem(LKEY+"_activa"); renderApp(); };
  renderList();
  if (modoSel) actualizarSelbar();
  if (activa && !timer) timer = setInterval(()=>{ if(activa) $("clockBig").textContent=fmtClock(Date.now()-activa.inicio); }, 1000);
  if (!activa && timer) { clearInterval(timer); timer=null; }
}

// Actualiza solo el gráfico (rango) con fade + slide, sin re-render completo
function actualizarGrafico(dir) {
  const g = datosGrafico();
  // toggle activo del segmented
  $$("#gseg [data-rango]").forEach(b=>{
    b.classList.toggle("on", b.dataset.rango === graphRango);
  });
  $("gmax").textContent = "Máx " + g.max + "h";
  const cont = $("ggraph");
  // reinsertar con animación en la dirección indicada
  const nuevo = document.createElement("div");
  nuevo.className = "graph-anim";
  nuevo.style.cssText = "width:100%;height:100%;display:flex;align-items:flex-end";
  nuevo.style.setProperty("--slide", (dir*12) + "px");
  nuevo.innerHTML = dotGraph(g.vals, g.max, 12, g.patrones);
  cont.replaceWith(nuevo);
  nuevo.id = "ggraph";
  const lab = $("glabels");
  lab.className = "graph-labels" + (g.sparse ? " sparse" : "");
  lab.innerHTML = g.labels.map(l=>`<span>${l}</span>`).join("");
}

// Barra inferior del modo selección de pagos
function actualizarSelbar() {
  const bar = $("selbar"); if (!bar) return;
  const items = historial.filter(s=>diasSel.has(claveDia(s.inicio)));
  const n = items.length;
  const h = items.reduce((a,s)=>a+(s.fin-s.inicio),0)/3600000;
  const eur = Math.round(sumaImporte(items));
  // ¿todos los seleccionados ya están pagados? entonces la acción es "marcar pendiente"
  const todosPagados = n>0 && items.every(s=>s.pagado);
  if (n===0) {
    bar.innerHTML = `<span class="selbar-txt">Toca los días a marcar</span>`;
    return;
  }
  bar.innerHTML = `<span class="selbar-txt">${diasSel.size} día(s) · ${fmtH(h)}${verPrecios()?` · ${eur}€`:""}</span>
    <button class="selbar-act" id="doPagar">${todosPagados?"Marcar pendiente":"Marcar pagado"}</button>`;
  $("doPagar").onclick = async ()=>{
    const ids = items.map(s=>s.id);
    await sbSetPagado(ids, !todosPagados);
    modoSel=false; diasSel.clear();
    await cargar();
  };
}

function generarResumenPago() {
  if (historial.length === 0) { alert("No hay fichajes todavía."); return; }
  const totH = historial.reduce((a,s)=>a+(s.fin-s.inicio),0)/3600000;
  const totEur = sumaImporte(historial);
  const tars = [...new Set(historial.map(s=>tarifaDe(s)))];
  // por semana (clave ISO aproximada: año-Wnº)
  const sem = {};
  historial.forEach(s=>{
    const d=new Date(s.inicio); const dow=(d.getDay()+6)%7;
    const lun=new Date(d); lun.setHours(0,0,0,0); lun.setDate(lun.getDate()-dow);
    const k=lun.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit"});
    if(!sem[k]) sem[k]={h:0,eur:0};
    sem[k].h+=(s.fin-s.inicio)/3600000; sem[k].eur+=importeDe(s);
  });
  // por categoría
  const cat={};
  historial.forEach(s=>{ const c=s.categoria||"Sin categoría"; cat[c]=(cat[c]||0)+(s.fin-s.inicio)/3600000; });

  let t = "🚐 Resumen horas camper\n\n";
  t += `TOTAL: ${fmtH(totH)}`;
  if (verPrecios()) t += ` · ${Math.round(totEur)}€${tars.length===1?` (a ${tars[0]}€/h)`:" (varias tarifas)"}`;
  t += "\n\nPor semana (desde lunes):\n";
  Object.keys(sem).forEach(k=>{ t += `• Sem ${k}: ${fmtH(sem[k].h)}${verPrecios()?` · ${Math.round(sem[k].eur)}€`:""}\n`; });
  t += "\nPor fase:\n";
  Object.keys(cat).forEach(k=>{ t += `• ${k}: ${fmtH(cat[k])}\n`; });

  // Desglose pagado / pendiente
  let hPag=0, hPend=0, eurPag=0, eurPend=0;
  historial.forEach(s=>{ const d=(s.fin-s.inicio)/3600000; if(s.pagado){ hPag+=d; eurPag+=importeDe(s); } else { hPend+=d; eurPend+=importeDe(s); } });
  t += "\nPagos:\n";
  t += `• Pendiente: ${fmtH(hPend)}${verPrecios()?` · ${Math.round(eurPend)}€`:""}\n`;
  t += `• Pagado: ${fmtH(hPag)}${verPrecios()?` · ${Math.round(eurPag)}€`:""}\n`;

  // Abrir WhatsApp con el texto; si el usuario cancela, ofrecer copiar
  if (confirm("Se abrirá WhatsApp con el resumen.\n\nAceptar = WhatsApp · Cancelar = copiar al portapapeles")) {
    window.open("https://wa.me/?text="+encodeURIComponent(t), "_blank");
  } else {
    navigator.clipboard?.writeText(t).then(()=>alert("Resumen copiado al portapapeles."), ()=>alert(t));
  }
}

function claveDia(ts){ const d=new Date(ts); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function tituloDia(ts){
  const hoy=new Date(), ayer=new Date(Date.now()-86400000);
  if(claveDia(ts)===claveDia(hoy)) return "Hoy";
  if(claveDia(ts)===claveDia(ayer)) return "Ayer";
  const d=new Date(ts);
  const dia = d.toLocaleDateString("es-ES",{weekday:"long"});
  const resto = d.toLocaleDateString("es-ES",{day:"numeric",month:"long"});
  return dia.charAt(0).toUpperCase()+dia.slice(1)+", "+resto; // "Domingo, 23 de agosto"
}
const LAPIZ = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

function renderList() {
  const list = $("list");
  if (!list) return;
  if (historial.length === 0) { list.innerHTML = '<div class="empty">Aún no hay fichajes. Dale a Empezar.</div>'; return; }
  const ahora = Date.now();

  // Filtro (no aplica en modo selección)
  let fuente = historial;
  if (!modoSel && filtro !== "todo") {
    fuente = historial.filter(s => filtro==="pag" ? s.pagado : !s.pagado);
  }
  if (fuente.length === 0) {
    list.innerHTML = `<div class="empty">${filtro==="pag"?"Nada pagado todavía.":"Nada pendiente. ¡Todo pagado!"}</div>`;
    return;
  }

  // Agrupar por día (ya viene ordenado desc por inicio)
  const dias = [];
  const idx = {};
  fuente.forEach(s => {
    const k = claveDia(s.inicio);
    if (idx[k]===undefined){ idx[k]=dias.length; dias.push({ k, ts:s.inicio, items:[] }); }
    dias[idx[k]].items.push(s);
  });

  list.innerHTML = dias.map(dia => {
    const ms = dia.items.reduce((a,s)=>a+(s.fin-s.inicio),0);
    const h = ms/3600000;
    const eurDia = Math.round(sumaImporte(dia.items));
    const abierto = diasAbiertos.has(dia.k);
    const filas = dia.items.map(s => {
      const editable = esAdmin() || (ahora - s.fin) < VENTANA_EDICION_MIN*60000;
      const euro = Math.round(importeDe(s));
      if (editando != null && String(editando) === String(s.id)) {
        return `<div class="item">
          <div class="edit-box">
            <label>Nota</label>
            <input class="edit-field" id="ed-nota-${s.id}" value="${escapeHtml(s.nota||"")}">
            <label>Categoría</label>
            <div class="cats" id="ed-cats-${s.id}">${CATEGORIAS.map(c=>`<button class="cat ${(s.categoria||"")===c?'sel':''}" data-edcat="${s.id}" data-val="${c}">${c}</button>`).join("")}</div>
            <div class="edit-row">
              <div><label>Empezó</label><input class="edit-field" type="datetime-local" id="ed-ini-${s.id}" value="${toLocalInput(s.inicio)}"></div>
              <div><label>Terminó</label><input class="edit-field" type="datetime-local" id="ed-fin-${s.id}" value="${toLocalInput(s.fin)}"></div>
            </div>
            <label>Tarifa (€/h)</label>
            <input class="edit-field" type="number" inputmode="decimal" step="0.5" min="0" id="ed-tar-${s.id}" value="${tarifaDe(s)}">
            <div class="edit-actions">
              <button class="mini save" data-save="${s.id}">Guardar</button>
              <button class="mini cancel" data-cancel="1">Cancelar</button>
              <button class="mini del" data-del="${s.id}">Borrar</button>
            </div>
          </div></div>`;
      }
      return `<div class="item ${s.pagado?'paid':''}">
        <div class="item-top">
          <div class="item-main">
            ${s.nota?`<div class="item-nota">${escapeHtml(s.nota)}</div>`:`<div class="item-nota item-sin">Sin nota</div>`}
            <div class="item-meta">${fmtDur(s.fin-s.inicio)} · ${fmtHora(s.inicio)}–${fmtHora(s.fin)}</div>
            ${s.categoria?`<div class="item-tags"><span class="tag">${escapeHtml(s.categoria)}</span></div>`:""}
          </div>
          <div class="item-right">
            ${verPrecios()?`<span class="item-precio"><span class="item-euro">${euro}€</span><span class="item-tarifa">${tarifaDe(s)}€/h</span></span>`:""}
            ${editable?`<button class="edit-icon" data-edit="${s.id}" title="Editar">${LAPIZ}</button>`:""}
          </div>
        </div>
      </div>`;
    }).join("");
    const diaPagado = dia.items.every(s=>s.pagado);
    const diaSelec = diasSel.has(dia.k);
    if (modoSel) {
      return `<div class="dia selmode ${diaSelec?'selected':''}">
        <button class="dia-head" data-seldia="${dia.k}">
          <span class="dia-left">
            <span class="check ${diaSelec?'on':''}"></span>
            <span class="dia-fecha">${tituloDia(dia.ts)}</span>
          </span>
          <span class="dia-tot">${fmtH(h)}${verPrecios()?` · ${eurDia}€`:""}${diaPagado?' <span class="pbadge">P</span>':''}</span>
        </button>
      </div>`;
    }
    return `<div class="dia ${abierto?'open':''}">
      <button class="dia-head" data-dia="${dia.k}">
        <span class="dia-fecha">${tituloDia(dia.ts)}</span>
        <span class="dia-tot">${fmtH(h)}${verPrecios()?` · ${eurDia}€`:""}${diaPagado?' <span class="pbadge sm">P</span>':''} <span class="chev">›</span></span>
      </button>
      <div class="dia-body"><div class="dia-inner">${filas}</div></div>
    </div>`;
  }).join("");

  list.querySelectorAll("[data-seldia]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.seldia;
    if(diasSel.has(k)) diasSel.delete(k); else diasSel.add(k);
    const el=b.closest(".dia");
    el.classList.toggle("selected", diasSel.has(k));
    el.querySelector(".check").classList.toggle("on", diasSel.has(k));
    actualizarSelbar();
  });
  list.querySelectorAll("[data-dia]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.dia;
    const diaEl = b.closest(".dia");
    if(diasAbiertos.has(k)){ diasAbiertos.delete(k); diaEl.classList.remove("open"); }
    else { diasAbiertos.add(k); diaEl.classList.add("open"); }
  });
  list.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ editando=b.dataset.edit; diasAbiertos.add(claveDia(historial.find(x=>String(x.id)===String(b.dataset.edit)).inicio)); renderList(); });
  list.querySelectorAll("[data-edcat]").forEach(b=>b.onclick=()=>{
    const cont=b.parentElement;
    const yaSel=b.classList.contains("sel");
    cont.querySelectorAll(".cat").forEach(x=>x.classList.remove("sel"));
    if(!yaSel) b.classList.add("sel");
  });
  list.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>{ editando=null; renderList(); });
  list.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>guardarEdit(b.dataset.save));
  list.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>borrar(b.dataset.del));
}

// ── Acciones ───────────────────────────────────────────────────
async function onMain() {
  if (activa) {
    const fin = Date.now();
    const reg = { ...activa, fin };
    activa = null;
    await sbInsert(reg);
  } else {
    const nota = ($("notaInput")?.value || "").trim();
    if (!nota || !catSel) {
      // sacudir el botón para indicar que faltan campos
      const b=$("mainBtn"); if(b){ b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); }
      if (!nota && $("notaInput")) $("notaInput").focus();
      return;
    }
    activa = { inicio: Date.now(), nota, categoria: catSel, tarifa };
    localStorage.setItem(LKEY+"_activa", JSON.stringify(activa));
    renderApp();
    return;
  }
  localStorage.removeItem(LKEY+"_activa");
  await cargar();
}

// Pausar: cierra el tramo actual (lo guarda) y deja la tarea en pausa para retomarla.
async function onPausar() {
  if (!activa) return;
  const fin = Date.now();
  const heredado = { nota: activa.nota, categoria: activa.categoria, tarifa: activa.tarifa };
  const dur = fin - activa.inicio;
  const reg = { ...activa, fin };
  activa = null;
  pausado = heredado;
  localStorage.removeItem(LKEY+"_activa");
  localStorage.setItem(LKEY+"_pausado", JSON.stringify(pausado));
  // tramos de menos de 1 min no se guardan (evita basura al pausar sin querer)
  if (dur >= 60000) { await sbInsert(reg); await cargar(); }
  else { renderApp(); }
}

// Retomar: abre un tramo nuevo heredando asunto, tag y tarifa; sin reescribir nada.
function onRetomar() {
  if (!pausado) return;
  activa = { inicio: Date.now(), nota: pausado.nota, categoria: pausado.categoria, tarifa: pausado.tarifa };
  pausado = null;
  localStorage.removeItem(LKEY+"_pausado");
  localStorage.setItem(LKEY+"_activa", JSON.stringify(activa));
  renderApp();
}

// Terminar tarea estando en pausa: simplemente descarta el estado pausado
// (el último tramo ya se guardó al pausar). No añade tiempo nuevo.
function onTerminarPausa() {
  pausado = null;
  localStorage.removeItem(LKEY+"_pausado");
  renderApp();
}

async function guardarEdit(id) {
  const nota = $(`ed-nota-${id}`).value.trim();
  const inicio = fromLocalInput($(`ed-ini-${id}`).value);
  const fin = fromLocalInput($(`ed-fin-${id}`).value);
  const catBtn = document.querySelector(`#ed-cats-${id} .cat.sel`);
  const categoria = catBtn ? catBtn.dataset.val : "";
  if (!(fin > inicio)) { alert("La hora de fin debe ser posterior al inicio."); return; }
  const tarInput = $(`ed-tar-${id}`);
  let tar = tarInput ? parseFloat(tarInput.value) : NaN;
  if (isNaN(tar) || tar<0) tar = tarifa; // si lo dejan vacío o inválido, la global
  await sbUpdate(id, { nota, inicio, fin, categoria, tarifa: tar });
  editando = null;
  await cargar();
}

async function borrar(id) {
  if (!confirm("¿Borrar este fichaje?")) return;
  await sbDelete(id);
  editando = null;
  await cargar();
}

// Añadir fichaje manual (admin): usa un pequeño formulario en la parte superior de la lista
let manualAbierto = false;
function abrirManual() {
  manualAbierto = true;
  const list = $("list");
  const ahora = new Date(); const hace1h = new Date(Date.now()-3600000);
  const box = document.createElement("div");
  box.className = "dia open manual-box";
  box.innerHTML = `<div style="padding:18px 16px">
    <div class="edit-box" style="padding:0">
      <div class="set-label" style="margin-bottom:12px">Nuevo fichaje manual</div>
      <label>Nota</label>
      <input class="edit-field" id="man-nota" placeholder="Qué se hizo">
      <label>Categoría</label>
      <div class="cats" id="man-cats">${CATEGORIAS.map(c=>`<button class="cat" data-mancat data-val="${c}">${c}</button>`).join("")}</div>
      <div class="edit-row">
        <div><label>Empezó</label><input class="edit-field" type="datetime-local" id="man-ini" value="${toLocalInput(hace1h.getTime())}"></div>
        <div><label>Terminó</label><input class="edit-field" type="datetime-local" id="man-fin" value="${toLocalInput(ahora.getTime())}"></div>
      </div>
      <div class="edit-actions">
        <button class="mini save" id="man-save">Guardar</button>
        <button class="mini cancel" id="man-cancel">Cancelar</button>
      </div>
    </div></div>`;
  list.prepend(box);
  box.querySelectorAll("[data-mancat]").forEach(b=>b.onclick=()=>{
    const yaSel=b.classList.contains("sel");
    box.querySelectorAll(".cat").forEach(x=>x.classList.remove("sel"));
    if(!yaSel) b.classList.add("sel");
  });
  $("man-cancel").onclick = ()=>{ manualAbierto=false; renderApp(); };
  $("man-save").onclick = async ()=>{
    const nota = $("man-nota").value.trim();
    const inicio = fromLocalInput($("man-ini").value);
    const fin = fromLocalInput($("man-fin").value);
    const catBtn = box.querySelector(".cat.sel");
    const categoria = catBtn ? catBtn.dataset.val : "";
    if (!(fin > inicio)) { alert("La hora de fin debe ser posterior al inicio."); return; }
    await sbInsert({ inicio, fin, nota, categoria, tarifa });
    manualAbierto=false;
    await cargar();
  };
}

async function onTarifa() {
  // Cambiar la tarifa requiere el código maestro (salvo que ya seas el admin maestro)
  if (!esMaestro) {
    const clave = prompt("Introduce el código de administrador para cambiar la tarifa:");
    if (clave === null) return;               // canceló
    if (clave.trim() !== COD_MAESTRO) { alert("Código incorrecto."); return; }
  }
  const v = prompt("Precio por hora (€):", tarifa);
  if (v!==null && !isNaN(parseFloat(v))) {
    tarifa = parseFloat(v);
    localStorage.setItem(LKEY+"_tarifa", tarifa);
    await guardarAjustes();
    renderApp();
  }
}

// ── Supabase ───────────────────────────────────────────────────
async function sbInsert(reg) {
  const { error } = await sb.from("fichajes").insert({
    codigo, inicio: new Date(reg.inicio).toISOString(), fin: new Date(reg.fin).toISOString(),
    nota: reg.nota||"", categoria: reg.categoria||"", tarifa: reg.tarifa!=null?reg.tarifa:tarifa
  });
  if (error) alert("Error al guardar: " + error.message);
}
async function sbUpdate(id, d) {
  const campos = { nota: d.nota, inicio: new Date(d.inicio).toISOString(), fin: new Date(d.fin).toISOString(), categoria: d.categoria||"" };
  if (d.tarifa!=null) campos.tarifa = d.tarifa;
  const { error } = await sb.from("fichajes").update(campos).eq("id", id).eq("codigo", codigo);
  if (error) alert("Error al editar: " + error.message);
}
async function sbDelete(id) {
  const { error } = await sb.from("fichajes").delete().eq("id", id).eq("codigo", codigo);
  if (error) alert("Error al borrar: " + error.message);
}
async function sbSetPagado(ids, valor) {
  const { error } = await sb.from("fichajes").update({ pagado: valor }).in("id", ids).eq("codigo", codigo);
  if (error) alert("Error al actualizar pagos: " + error.message);
}

async function guardarTarifa(t) { return guardarAjustes(); }
async function guardarAjustes() {
  const { error } = await sb.from("ajustes").upsert(
    { codigo, tarifa, ocultar_global: ocultarGlobal, ocultar_hugo: ocultarHugo },
    { onConflict: "codigo" });
  if (error) console.warn("No se pudieron guardar los ajustes:", error.message);
  // si esta furgo está gestionada por el admin maestro, mantener sincronizada la tabla usuarios
  try { await sb.from("usuarios").update({ tarifa, ocultar_global: ocultarGlobal, ocultar_hugo: ocultarHugo }).eq("codigo", codigo); } catch(e){}
}
async function leerAjustes() {
  const { data, error } = await sb.from("ajustes").select("*").eq("codigo", codigo).maybeSingle();
  if (error || !data) return;
  if (data.tarifa != null) { tarifa = parseFloat(data.tarifa); localStorage.setItem(LKEY+"_tarifa", tarifa); }
  ocultarGlobal = !!data.ocultar_global;
  ocultarHugo = !!data.ocultar_hugo;
}

async function borrarTodo() {
  const conf = prompt('Esto borra TODOS los fichajes y no se puede deshacer.\nEscribe BORRAR para confirmar:');
  if (conf !== "BORRAR") { if (conf!==null) alert("Cancelado: no escribiste BORRAR."); return; }
  const { error } = await sb.from("fichajes").delete().eq("codigo", codigo);
  if (error) { alert("Error al borrar: " + error.message); return; }
  historial = []; diasAbiertos.clear();
  alert("Historial borrado.");
  renderApp();
}

async function cargar() {
  if (!cfgOk) { renderApp(); return; }
  if (!codigo) { renderGate(); return; }
  persona = "Edgar"; // ya no hay roles: quien entra gestiona todo
  // recuperar fichaje activo local
  try { const a = localStorage.getItem(LKEY+"_activa"); activa = a?JSON.parse(a):null; } catch(e){ activa=null; }
  try { const p = localStorage.getItem(LKEY+"_pausado"); pausado = p?JSON.parse(p):null; } catch(e){ pausado=null; }
  tarifa = parseFloat(localStorage.getItem(LKEY+"_tarifa")) || TARIFA_DEFECTO;
  // ajustes compartidos (tarifa + visibilidad de precios)
  try { await leerAjustes(); } catch(e){}

  const { data, error } = await sb.from("fichajes").select("*").eq("codigo", codigo).order("inicio",{ascending:false});
  if (error) {
    if (error.message && /invalid|jwt|key/i.test(error.message)) { renderGate("No se pudo conectar. Revisa las claves."); }
    else { renderGate("Código no válido o sin datos: " + error.message); }
    return;
  }
  historial = (data||[]).map(r => ({ id: r.id, inicio: new Date(r.inicio).getTime(), fin: new Date(r.fin).getTime(), nota: r.nota, categoria: r.categoria||"", pagado: !!r.pagado, tarifa: r.tarifa==null?null:parseFloat(r.tarifa) }));
  // Migración: los fichajes antiguos sin tarifa se congelan a la tarifa actual.
  const sinTarifa = historial.filter(s=>s.tarifa==null);
  if (sinTarifa.length) {
    const ids = sinTarifa.map(s=>s.id);
    try {
      await sb.from("fichajes").update({ tarifa }).in("id", ids);
      sinTarifa.forEach(s=>{ s.tarifa = tarifa; });
    } catch(e){ /* si falla, se reintenta en la próxima carga */ }
  }
  renderApp();
}

// ── Arranque ───────────────────────────────────────────────────
if (!cfgOk) {
  $("app").innerHTML = `<div class="gate"><div class="logo" style="margin:0 auto">🚐</div>
    <h2>Falta configurar</h2>
    <p>Abre el archivo y rellena <b>SUPABASE_URL</b> y <b>SUPABASE_KEY</b> con tus claves (mira la guía).</p></div>`;
} else if (esMaestro && !codigo) {
  cargarUsuarios();
} else if (!codigo) {
  renderGate();
} else {
  cargar();
}
</script>
