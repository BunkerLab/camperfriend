<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2E5D4B">
<title>Fichador · Camper</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚐</text></svg>">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --coral: #FF5A5F; --coral-osc: #E0484D; --coral-suave: #FFF0F0;
    --tinta: #222222; --gris: #717171; --gris-claro: #EBEBEB;
    --fondo: #F7F7F7; --caja: #FFFFFF;
  }
  body {
    margin: 0; font-family: "Inter", system-ui, -apple-system, sans-serif;
    background: var(--caja); min-height: 100vh; color: var(--tinta);
    display: flex; align-items: flex-start; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .phone {
    width: 100%; max-width: 400px; background: var(--caja);
    padding: 20px 18px calc(24px + env(safe-area-inset-bottom));
  }
  /* En pantallas grandes, la app se muestra como una tarjeta centrada sobre fondo gris */
  @media (min-width: 700px) {
    body { background: var(--fondo); padding: 24px; }
    .phone {
      border-radius: 20px; padding: 24px;
      box-shadow: 0 6px 20px rgba(0,0,0,.05), 0 1px 3px rgba(0,0,0,.04);
      margin-top: 8px;
    }
  }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .head-txt { flex: 1; min-width: 0; }
  .icon-btn { background: var(--fondo); border: none; border-radius: 12px; cursor: pointer;
              width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
              color: var(--gris); flex-shrink: 0; transition: background .15s, color .15s; }
  .icon-btn:active { background: var(--gris-claro); color: var(--tinta); }
  .logo { font-size: 24px; background: var(--coral-suave); width: 44px; height: 44px;
          border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .title { font-weight: 600; font-size: 16px; color: var(--tinta); letter-spacing: -.2px; }
  .sub { font-size: 13px; color: var(--gris); margin-top: 1px; }
  .clock { background: var(--fondo); border-radius: 16px; padding: 26px 16px;
           text-align: center; margin-bottom: 16px; border: 1px solid transparent; transition: .25s; }
  .clock.on { background: var(--coral-suave); border-color: rgba(255,90,95,.25); }
  .clock-lbl { font-size: 13px; color: var(--gris); margin-bottom: 8px; }
  .clock-big { font-size: 46px; font-weight: 700; color: var(--tinta);
               letter-spacing: -1.5px; font-variant-numeric: tabular-nums; }
  .clock.on .clock-big { color: var(--coral-osc); }
  .clock-big.off { color: var(--gris-claro); }
  .clock-note { font-size: 13px; color: var(--coral-osc); margin-top: 8px; }
  .live { display: inline-flex; align-items: center; gap: 7px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--coral);
              animation: pulse 1s steps(1,end) infinite; }
  @keyframes pulse { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
  input.nota, input.edit-field {
    width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--gris-claro);
    font-size: 15px; margin-bottom: 12px; outline: none; font-family: inherit; color: var(--tinta);
    transition: border-color .15s;
  }
  input.edit-field[type="datetime-local"] {
    -webkit-appearance: none; appearance: none;
    background: none; border: none; border-radius: 0; padding: 6px 0;
    border-bottom: 1px solid var(--gris-claro); min-height: 44px; display: block;
    font-size: 16px;
  }
  input.edit-field[type="datetime-local"]:focus { border-bottom-color: var(--tinta); }
  input.edit-field[type="datetime-local"]::-webkit-date-and-time-value {
    text-align: left; margin: 0;
  }
  /* En desktop sí lo mostramos dentro de una caja */
  @media (min-width: 700px) {
    input.edit-field[type="datetime-local"] {
      background: var(--caja); border: 1px solid var(--gris-claro);
      border-radius: 12px; padding: 14px 16px;
    }
    input.edit-field[type="datetime-local"]:focus { border-color: var(--tinta); }
  }
  input.nota::placeholder { color: #B0B0B0; }
  input.nota:focus, input.edit-field:focus { border-color: var(--tinta); }
  .btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-size: 16px;
         font-weight: 600; color: #fff; cursor: pointer; margin-bottom: 18px; letter-spacing: -.2px;
         transition: transform .08s, background .15s; }
  .btn:active { transform: scale(.985); }
  .btn.start { background: var(--coral); }
  .btn.start:active { background: var(--coral-osc); }
  .btn.stop { background: var(--tinta); }
  .btn:disabled { opacity: .4; }
  .totals { display: flex; gap: 12px; margin-bottom: 24px; }
  .tbox { flex: 1; background: var(--fondo); border-radius: 14px; padding: 16px 12px; text-align: center; }
  .tbox.solo { flex: 1 1 100%; }
  .tnum { font-size: 24px; font-weight: 700; color: var(--tinta); letter-spacing: -.5px; }
  .tlbl { font-size: 12px; color: var(--gris); margin-top: 3px; }
  .hist-head { display: flex; justify-content: space-between; align-items: center;
               margin-bottom: 12px; font-size: 15px; font-weight: 600; color: var(--tinta); }
  .refresh { background: none; border: 1px solid var(--gris-claro); border-radius: 20px;
             padding: 7px 14px; font-size: 13px; color: var(--tinta); cursor: pointer; font-weight: 500;
             transition: border-color .15s; }
  .refresh:active { border-color: var(--tinta); }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .empty { color: var(--gris); font-size: 14px; text-align: center; padding: 28px 10px; }
  .dia { border: 1px solid var(--gris-claro); border-radius: 14px; overflow: hidden; }
  .dia-head { width: 100%; background: none; border: none; cursor: pointer;
              display: flex; justify-content: space-between; align-items: center;
              padding: 15px 16px; font-family: inherit; }
  .dia-fecha { font-weight: 600; font-size: 15px; color: var(--tinta); }
  .dia-tot { font-size: 13px; color: var(--gris); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .chev { display: inline-block; font-size: 18px; color: var(--gris); transition: transform .2s; }
  .dia.open .chev { transform: rotate(90deg); }
  .dia-body { display: none; padding: 0 16px; }
  .dia.open .dia-body { display: block; border-top: 1px solid var(--gris-claro); }
  .item { background: var(--caja); padding: 14px 0; border-bottom: 1px solid var(--gris-claro); }
  .item:last-child { border-bottom: none; }
  .item-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .item-main { min-width: 0; }
  .item-nota { font-size: 15px; color: var(--tinta); font-weight: 500; letter-spacing: -.2px;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-sin { color: var(--gris); font-weight: 400; font-style: italic; }
  .item-meta { font-size: 13px; color: var(--gris); margin-top: 3px; }
  .item-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .item-euro { font-weight: 600; color: var(--tinta); font-size: 15px; }
  .edit-icon { background: var(--fondo); border: none; border-radius: 9px; cursor: pointer;
               width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
               color: var(--gris); transition: background .15s, color .15s; }
  .edit-icon:active { background: var(--gris-claro); color: var(--tinta); }
  .edit-box { margin-top: 4px; padding: 4px 0 8px; }
  .edit-box label { font-size: 12px; color: var(--gris); display: block; margin-bottom: 4px; font-weight: 500; }
  .edit-row { display: flex; flex-direction: column; gap: 10px; }
  .edit-row > div { flex: 1; }
  .edit-actions { display: flex; gap: 8px; margin-top: 8px; }
  .mini { padding: 11px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; flex: 1; }
  .mini.save { background: var(--coral); color: #fff; }
  .mini.cancel { background: var(--fondo); color: var(--tinta); border: 1px solid var(--gris-claro); }
  .mini.del { background: none; color: var(--coral-osc); border: 1px solid var(--gris-claro); }
  /* Pie */
  .foot { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--gris-claro);
          display: flex; justify-content: space-between; align-items: center; }
  .foot-user { font-size: 14px; color: var(--tinta); font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .foot-salir { font-size: 13px; color: var(--gris); cursor: pointer; text-decoration: none;
                padding: 7px 14px; border: 1px solid var(--gris-claro); border-radius: 20px; }
  .foot-salir:active { border-color: var(--tinta); color: var(--tinta); }
  .badge { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 20px;
           background: var(--coral-suave); color: var(--coral-osc); font-weight: 600; }
  /* Ajustes */
  .set-group { margin-bottom: 22px; }
  .set-group.danger { margin-top: 8px; }
  .set-label { font-size: 12px; font-weight: 600; color: var(--gris); text-transform: uppercase;
               letter-spacing: .5px; margin-bottom: 10px; }
  .set-group.danger .set-label { color: var(--coral-osc); }
  .set-row { display: flex; justify-content: space-between; align-items: center; gap: 14px;
             padding: 14px 0; border-bottom: 1px solid var(--gris-claro); }
  .set-row:last-child { border-bottom: none; }
  .set-row-t { font-size: 15px; font-weight: 500; color: var(--tinta); }
  .set-row-s { font-size: 13px; color: var(--gris); margin-top: 2px; }
  .set-val { font-size: 16px; font-weight: 600; color: var(--tinta); }
  .set-hint { font-size: 13px; color: var(--gris); margin-top: 8px; }
  .pill { background: var(--fondo); border: 1px solid var(--gris-claro); border-radius: 20px;
          padding: 9px 16px; font-size: 14px; font-weight: 600; color: var(--tinta); cursor: pointer;
          flex-shrink: 0; font-family: inherit; }
  .pill:active { background: var(--gris-claro); }
  .pill.danger { background: none; color: var(--coral-osc); border-color: rgba(255,90,95,.4); }
  .pill.danger:active { background: var(--coral-suave); }
  /* Segmented control */
  .seg { display: flex; background: var(--fondo); border-radius: 12px; padding: 4px; gap: 4px; }
  .seg-btn { flex: 1; border: none; background: none; padding: 12px; border-radius: 9px;
             font-size: 15px; font-weight: 600; color: var(--gris); cursor: pointer; font-family: inherit;
             transition: background .15s, color .15s; }
  .seg-btn.active { background: var(--caja); color: var(--tinta); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  /* Switch */
  .switch { width: 50px; height: 30px; border-radius: 20px; background: var(--gris-claro);
            border: none; cursor: pointer; position: relative; flex-shrink: 0; transition: background .2s; padding: 0; }
  .switch.on { background: var(--coral); }
  .knob { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
          background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
  .switch.on .knob { transform: translateX(20px); }
  /* Pantalla de acceso */
  .gate { text-align: center; padding: 16px 6px; }
  .gate h2 { color: var(--tinta); margin: 12px 0 4px; font-weight: 600; letter-spacing: -.3px; }
  .gate p { color: var(--gris); font-size: 14px; margin: 0 0 20px; }
  .status { font-size: 13px; color: var(--gris); text-align: center; margin-top: 10px; min-height: 16px; }
  .err { color: var(--coral-osc); }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="phone" id="app"></div>

<script>
// ═══════════════════════════════════════════════════════════════
//  CONFIGURACIÓN — rellena estas dos líneas con tus claves de Supabase
//  (las encuentras en Supabase → Project Settings → API)
// ═══════════════════════════════════════════════════════════════
const SUPABASE_URL = "https://sirhampdbynywexmzeum.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpcmhhbXBkYnlueXdleG16ZXVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2ODY0NDIsImV4cCI6MjEwMzI2MjQ0Mn0.SGZAaoI7AOChS8X19ucN9n7XY4Pev1b1xG9VchkXP0s";
const TARIFA_DEFECTO = 10; // €/hora
const VENTANA_EDICION_MIN = 60; // minutos que puede editar Hugo tras terminar
const PASS_ADMIN = "camper-edgar"; // contraseña de Edgar (admin) — cámbiala por la que quieras
// ═══════════════════════════════════════════════════════════════

const LKEY = "fichador_camper_cloud";
let sb = null, activa = null, historial = [], tarifa = TARIFA_DEFECTO;
let codigo = localStorage.getItem(LKEY + "_codigo") || null;
let persona = localStorage.getItem(LKEY + "_persona") || null; // "Hugo" | "Edgar"
let editando = null; // id del fichaje en edición
let diasAbiertos = new Set(); // claves de día abiertas en el acordeón
let ocultarGlobal = false;  // ocultar precios para todos (guardado en Supabase)
let ocultarHugo = false;    // ocultar precios solo en la vista de Hugo (guardado en Supabase)
let timer = null;
const esAdmin = () => persona === "Edgar";
// ¿Se muestran los precios en la vista actual?
const verPrecios = () => {
  if (ocultarGlobal) return false;
  if (ocultarHugo && persona === "Hugo") return false;
  return true;
};

const cfgOk = SUPABASE_URL !== "PON_AQUI_TU_URL" && SUPABASE_KEY !== "PON_AQUI_TU_ANON_KEY";
if (cfgOk) sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));
const ENGRANAJE = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>';
const FLECHA = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>';
const fmtDur = (ms) => { const m = Math.floor(ms/60000); return `${Math.floor(m/60)}h ${String(m%60).padStart(2,"0")}m`; };
const fmtHora = (ts) => new Date(ts).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
const fmtFecha = (ts) => new Date(ts).toLocaleDateString("es-ES",{weekday:"short",day:"2-digit",month:"short"});
const escapeHtml = (s="") => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// para inputs datetime-local (hora local sin zona)
const toLocalInput = (ts) => { const d=new Date(ts); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); };
const fromLocalInput = (v) => new Date(v).getTime();

// ── Pantalla de acceso ─────────────────────────────────────────
function renderGate(msg) {
  $("app").innerHTML = `
    <div class="gate">
      <div class="logo" style="margin:0 auto">🚐</div>
      <h2>Fichador · Camper</h2>
      <p>Introduce el código para acceder</p>
      <input class="nota" id="codeInput" placeholder="Código secreto" style="text-align:center">
      <button class="btn start" id="enterBtn">Entrar</button>
      <div class="status ${msg?'err':''}" id="gateStatus">${msg||""}</div>
    </div>`;
  $("enterBtn").onclick = () => {
    const c = $("codeInput").value.trim();
    if (!c) { $("gateStatus").textContent = "Escribe el código."; return; }
    codigo = c; localStorage.setItem(LKEY + "_codigo", c);
    cargar();
  };
  $("codeInput").addEventListener("keydown", e => { if (e.key==="Enter") $("enterBtn").click(); });
}

// ── Pantalla: ¿Quién eres? ─────────────────────────────────────
function renderPersona(msg) {
  $("app").innerHTML = `
    <div class="gate">
      <div class="logo" style="margin:0 auto">🚐</div>
      <h2>¿Quién eres?</h2>
      <p>Elige tu nombre para entrar</p>
      <button class="btn start" id="soyHugo" style="margin-bottom:12px">Hugo</button>
      <button class="btn" id="soyEdgar" style="background:var(--tinta)">Edgar (admin)</button>
      <div id="adminPass" style="display:none;margin-top:16px">
        <input class="nota" id="passInput" type="password" placeholder="Contraseña de admin" style="text-align:center">
        <button class="btn start" id="passBtn">Entrar como Edgar</button>
      </div>
      <div class="status ${msg?'err':''}" id="pStatus">${msg||""}</div>
      <div style="margin-top:14px"><a class="cfg-link" id="cambiarCodigo" style="color:var(--gris);font-size:12px;text-decoration:underline;cursor:pointer">cambiar código</a></div>
    </div>`;
  $("soyHugo").onclick = () => { persona = "Hugo"; localStorage.setItem(LKEY+"_persona","Hugo"); cargar(); };
  $("soyEdgar").onclick = () => { $("adminPass").style.display = "block"; $("passInput").focus(); };
  const entrarEdgar = () => {
    if ($("passInput").value === PASS_ADMIN) {
      persona = "Edgar"; localStorage.setItem(LKEY+"_persona","Edgar"); cargar();
    } else { renderPersona("Contraseña incorrecta."); $("adminPass").style.display="block"; }
  };
  $("passBtn").onclick = entrarEdgar;
  $("passInput").addEventListener("keydown", e => { if (e.key==="Enter") entrarEdgar(); });
  $("cambiarCodigo").onclick = () => {
    localStorage.removeItem(LKEY+"_codigo"); localStorage.removeItem(LKEY+"_persona");
    codigo = null; persona = null; renderGate();
  };
}

// ── App principal ──────────────────────────────────────────────
function renderApp() {
  const totMs = historial.reduce((a,s)=>a+(s.fin-s.inicio),0);
  const totH = totMs/3600000;
  const vp = verPrecios();
  $("app").innerHTML = `
    <header>
      <div class="logo">🚐</div>
      <div class="head-txt">
        <div class="title">Fichador · Camper</div>
        <div class="sub">Ficha tus horas de trabajo</div>
      </div>
      ${esAdmin()?`<button class="icon-btn" id="ajustesBtn" title="Ajustes">${ENGRANAJE}</button>`:""}
    </header>
    <div class="clock ${activa?'on':''}">
      <div class="clock-lbl">${activa?`<span class="live"><span class="live-dot"></span>Trabajando desde las ${fmtHora(activa.inicio)}</span>`:"Sin fichaje activo"}</div>
      <div class="clock-big ${activa?'':'off'}" id="clockBig">${activa?fmtDur(Date.now()-activa.inicio):"0h 00m"}</div>
      ${activa&&activa.nota?`<div class="clock-note">“${escapeHtml(activa.nota)}”</div>`:""}
    </div>
    ${!activa?`<input class="nota" id="notaInput" placeholder="¿En qué vas a trabajar? (opcional)">`:""}
    <button class="btn ${activa?'stop':'start'}" id="mainBtn">${activa?"■ Terminar":"▶ Empezar"}</button>
    <div class="totals">
      <div class="tbox ${vp?'':'solo'}"><div class="tnum">${totH.toFixed(1)}h</div><div class="tlbl">acumuladas</div></div>
      ${vp?`<div class="tbox"><div class="tnum">${Math.round(totH*tarifa)}€</div><div class="tlbl">a ${tarifa}€/h</div></div>`:""}
    </div>
    <div class="hist-head">
      <span>Historial</span>
      <button class="refresh" id="refreshBtn">↻ Actualizar</button>
    </div>
    <div class="list" id="list"></div>
    <div class="foot">
      <span class="foot-user">${persona==="Edgar"?"👤":"🔧"} ${escapeHtml(persona||"")}${esAdmin()?' <span class="badge">admin</span>':''}</span>
      <a id="salir" class="foot-salir">Salir</a>
    </div>`;

  $("mainBtn").onclick = onMain;
  $("refreshBtn").onclick = cargar;
  $("salir").onclick = () => {
    localStorage.removeItem(LKEY+"_codigo"); localStorage.removeItem(LKEY+"_persona");
    codigo=null; persona=null; renderGate();
  };
  if ($("ajustesBtn")) $("ajustesBtn").onclick = renderAjustes;
  renderList();
  if (activa && !timer) timer = setInterval(()=>{ if(activa) $("clockBig").textContent=fmtDur(Date.now()-activa.inicio); }, 1000);
  if (!activa && timer) { clearInterval(timer); timer=null; }
}

// ── Pantalla de ajustes (solo admin) ───────────────────────────
function renderAjustes() {
  $("app").innerHTML = `
    <header>
      <button class="icon-btn" id="volverBtn" title="Volver">${FLECHA}</button>
      <div class="head-txt"><div class="title">Ajustes</div><div class="sub">Solo administrador</div></div>
    </header>

    <div class="set-group">
      <div class="set-label">Ver la app como</div>
      <div class="seg">
        <button class="seg-btn ${persona==='Hugo'?'active':''}" data-persona="Hugo">🔧 Hugo</button>
        <button class="seg-btn ${persona==='Edgar'?'active':''}" data-persona="Edgar">👤 Edgar</button>
      </div>
      <div class="set-hint">Cambia entre vistas sin salir de la sesión.</div>
    </div>

    <div class="set-group">
      <div class="set-label">Tarifa por hora</div>
      <div class="set-row">
        <span class="set-val">${tarifa} €/h</span>
        <button class="pill" id="editTarifa">Cambiar</button>
      </div>
    </div>

    <div class="set-group">
      <div class="set-label">Precios</div>
      <div class="set-row">
        <div><div class="set-row-t">Ocultar precios para todos</div><div class="set-row-s">Hugo y Edgar solo verán horas</div></div>
        <button class="switch ${ocultarGlobal?'on':''}" id="tglGlobal" role="switch"><span class="knob"></span></button>
      </div>
      <div class="set-row">
        <div><div class="set-row-t">Ocultar precios a Hugo</div><div class="set-row-s">Tú sigues viéndolos, Hugo no</div></div>
        <button class="switch ${ocultarHugo?'on':''}" id="tglHugo" role="switch"><span class="knob"></span></button>
      </div>
    </div>

    <div class="set-group danger">
      <div class="set-label">Zona peligrosa</div>
      <div class="set-row">
        <div><div class="set-row-t">Borrar todo el historial</div><div class="set-row-s">Elimina todos los fichajes. Irreversible.</div></div>
        <button class="pill danger" id="borrarTodo">Borrar</button>
      </div>
    </div>`;

  $("volverBtn").onclick = renderApp;
  $$("[data-persona]").forEach(b=>b.onclick=async ()=>{
    persona = b.dataset.persona; localStorage.setItem(LKEY+"_persona", persona);
    await cargar(); // recarga con la vista de la otra persona
  });
  $("editTarifa").onclick = onTarifa;
  $("tglGlobal").onclick = async ()=>{ ocultarGlobal = !ocultarGlobal; await guardarAjustes(); renderAjustes(); };
  $("tglHugo").onclick = async ()=>{ ocultarHugo = !ocultarHugo; await guardarAjustes(); renderAjustes(); };
  $("borrarTodo").onclick = borrarTodo;
}

function claveDia(ts){ const d=new Date(ts); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function tituloDia(ts){
  const hoy=new Date(), ayer=new Date(Date.now()-86400000);
  if(claveDia(ts)===claveDia(hoy)) return "Hoy";
  if(claveDia(ts)===claveDia(ayer)) return "Ayer";
  const d=new Date(ts);
  const dia = d.toLocaleDateString("es-ES",{weekday:"long"});
  const resto = d.toLocaleDateString("es-ES",{day:"numeric",month:"long"});
  return dia.charAt(0).toUpperCase()+dia.slice(1)+", "+resto; // "Domingo, 23 de agosto"
}
const LAPIZ = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

function renderList() {
  const list = $("list");
  if (!list) return;
  if (historial.length === 0) { list.innerHTML = '<div class="empty">Aún no hay fichajes. Dale a Empezar.</div>'; return; }
  const ahora = Date.now();

  // Agrupar por día (historial ya viene ordenado desc por inicio)
  const dias = [];
  const idx = {};
  historial.forEach(s => {
    const k = claveDia(s.inicio);
    if (idx[k]===undefined){ idx[k]=dias.length; dias.push({ k, ts:s.inicio, items:[] }); }
    dias[idx[k]].items.push(s);
  });

  list.innerHTML = dias.map(dia => {
    const ms = dia.items.reduce((a,s)=>a+(s.fin-s.inicio),0);
    const h = ms/3600000;
    const abierto = diasAbiertos.has(dia.k);
    const filas = dia.items.map(s => {
      const editable = esAdmin() || (ahora - s.fin) < VENTANA_EDICION_MIN*60000;
      const euro = Math.round((s.fin-s.inicio)/3600000*tarifa);
      if (editando != null && String(editando) === String(s.id)) {
        return `<div class="item">
          <div class="edit-box">
            <label>Nota</label>
            <input class="edit-field" id="ed-nota-${s.id}" value="${escapeHtml(s.nota||"")}">
            <div class="edit-row">
              <div><label>Empezó</label><input class="edit-field" type="datetime-local" id="ed-ini-${s.id}" value="${toLocalInput(s.inicio)}"></div>
              <div><label>Terminó</label><input class="edit-field" type="datetime-local" id="ed-fin-${s.id}" value="${toLocalInput(s.fin)}"></div>
            </div>
            <div class="edit-actions">
              <button class="mini save" data-save="${s.id}">Guardar</button>
              <button class="mini cancel" data-cancel="1">Cancelar</button>
              <button class="mini del" data-del="${s.id}">Borrar</button>
            </div>
          </div></div>`;
      }
      return `<div class="item">
        <div class="item-top">
          <div class="item-main">
            ${s.nota?`<div class="item-nota">${escapeHtml(s.nota)}</div>`:`<div class="item-nota item-sin">Sin nota</div>`}
            <div class="item-meta">${fmtDur(s.fin-s.inicio)} · ${fmtHora(s.inicio)}–${fmtHora(s.fin)}</div>
          </div>
          <div class="item-right">
            ${verPrecios()?`<span class="item-euro">${euro}€</span>`:""}
            ${editable?`<button class="edit-icon" data-edit="${s.id}" title="Editar">${LAPIZ}</button>`:""}
          </div>
        </div>
      </div>`;
    }).join("");
    return `<div class="dia ${abierto?'open':''}">
      <button class="dia-head" data-dia="${dia.k}">
        <span class="dia-fecha">${tituloDia(dia.ts)}</span>
        <span class="dia-tot">${h.toFixed(1)}h${verPrecios()?` · ${Math.round(h*tarifa)}€`:""} <span class="chev">›</span></span>
      </button>
      <div class="dia-body">${filas}</div>
    </div>`;
  }).join("");

  list.querySelectorAll("[data-dia]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.dia;
    if(diasAbiertos.has(k)) diasAbiertos.delete(k); else diasAbiertos.add(k);
    renderList();
  });
  list.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ editando=b.dataset.edit; diasAbiertos.add(claveDia(historial.find(x=>String(x.id)===String(b.dataset.edit)).inicio)); renderList(); });
  list.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>{ editando=null; renderList(); });
  list.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>guardarEdit(b.dataset.save));
  list.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>borrar(b.dataset.del));
}

// ── Acciones ───────────────────────────────────────────────────
async function onMain() {
  if (activa) {
    const fin = Date.now();
    const reg = { ...activa, fin };
    activa = null;
    await sbInsert(reg);
  } else {
    const nota = ($("notaInput")?.value || "").trim();
    activa = { inicio: Date.now(), nota };
    localStorage.setItem(LKEY+"_activa", JSON.stringify(activa));
    renderApp();
    return;
  }
  localStorage.removeItem(LKEY+"_activa");
  await cargar();
}

async function guardarEdit(id) {
  const nota = $(`ed-nota-${id}`).value.trim();
  const inicio = fromLocalInput($(`ed-ini-${id}`).value);
  const fin = fromLocalInput($(`ed-fin-${id}`).value);
  if (!(fin > inicio)) { alert("La hora de fin debe ser posterior al inicio."); return; }
  await sbUpdate(id, { nota, inicio, fin });
  editando = null;
  await cargar();
}

async function borrar(id) {
  if (!confirm("¿Borrar este fichaje?")) return;
  await sbDelete(id);
  editando = null;
  await cargar();
}

async function onTarifa() {
  if (!esAdmin()) return;
  const v = prompt("Precio por hora (€):", tarifa);
  if (v!==null && !isNaN(parseFloat(v))) {
    tarifa = parseFloat(v);
    localStorage.setItem(LKEY+"_tarifa", tarifa);
    await guardarAjustes();
    renderAjustes();
  }
}

// ── Supabase ───────────────────────────────────────────────────
async function sbInsert(reg) {
  const { error } = await sb.from("fichajes").insert({
    codigo, inicio: new Date(reg.inicio).toISOString(), fin: new Date(reg.fin).toISOString(), nota: reg.nota||""
  });
  if (error) alert("Error al guardar: " + error.message);
}
async function sbUpdate(id, d) {
  const { error } = await sb.from("fichajes").update({
    nota: d.nota, inicio: new Date(d.inicio).toISOString(), fin: new Date(d.fin).toISOString()
  }).eq("id", id).eq("codigo", codigo);
  if (error) alert("Error al editar: " + error.message);
}
async function sbDelete(id) {
  const { error } = await sb.from("fichajes").delete().eq("id", id).eq("codigo", codigo);
  if (error) alert("Error al borrar: " + error.message);
}

async function guardarTarifa(t) { return guardarAjustes(); }
async function guardarAjustes() {
  const { error } = await sb.from("ajustes").upsert(
    { codigo, tarifa, ocultar_global: ocultarGlobal, ocultar_hugo: ocultarHugo },
    { onConflict: "codigo" });
  if (error) console.warn("No se pudieron guardar los ajustes:", error.message);
}
async function leerAjustes() {
  const { data, error } = await sb.from("ajustes").select("*").eq("codigo", codigo).maybeSingle();
  if (error || !data) return;
  if (data.tarifa != null) { tarifa = parseFloat(data.tarifa); localStorage.setItem(LKEY+"_tarifa", tarifa); }
  ocultarGlobal = !!data.ocultar_global;
  ocultarHugo = !!data.ocultar_hugo;
}

async function borrarTodo() {
  const conf = prompt('Esto borra TODOS los fichajes y no se puede deshacer.\nEscribe BORRAR para confirmar:');
  if (conf !== "BORRAR") { if (conf!==null) alert("Cancelado: no escribiste BORRAR."); return; }
  const { error } = await sb.from("fichajes").delete().eq("codigo", codigo);
  if (error) { alert("Error al borrar: " + error.message); return; }
  historial = []; diasAbiertos.clear();
  alert("Historial borrado.");
  renderApp();
}

async function cargar() {
  if (!cfgOk) { renderApp(); return; }
  if (!codigo) { renderGate(); return; }
  if (!persona) { renderPersona(); return; }
  // recuperar fichaje activo local
  try { const a = localStorage.getItem(LKEY+"_activa"); activa = a?JSON.parse(a):null; } catch(e){ activa=null; }
  tarifa = parseFloat(localStorage.getItem(LKEY+"_tarifa")) || TARIFA_DEFECTO;
  // ajustes compartidos (tarifa + visibilidad de precios)
  try { await leerAjustes(); } catch(e){}

  const { data, error } = await sb.from("fichajes").select("*").eq("codigo", codigo).order("inicio",{ascending:false});
  if (error) {
    if (error.message && /invalid|jwt|key/i.test(error.message)) { renderGate("No se pudo conectar. Revisa las claves."); }
    else { renderGate("Código no válido o sin datos: " + error.message); }
    return;
  }
  historial = (data||[]).map(r => ({ id: r.id, inicio: new Date(r.inicio).getTime(), fin: new Date(r.fin).getTime(), nota: r.nota }));
  renderApp();
}

// ── Arranque ───────────────────────────────────────────────────
if (!cfgOk) {
  $("app").innerHTML = `<div class="gate"><div class="logo" style="margin:0 auto">🚐</div>
    <h2>Falta configurar</h2>
    <p>Abre el archivo y rellena <b>SUPABASE_URL</b> y <b>SUPABASE_KEY</b> con tus claves (mira la guía).</p></div>`;
} else if (!codigo) {
  renderGate();
} else if (!persona) {
  renderPersona();
} else {
  cargar();
}
</script>
